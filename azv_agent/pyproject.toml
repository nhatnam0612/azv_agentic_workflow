[project]
name = "azv-agent"
version = "0.1.0"
description = "Two-agent Pydantic AI workflow for invoice extraction and AZV case assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-ai>=2.35,<3",
    "python-dotenv>=1.1,<2",
    "pypdf>=6,<7",
]

[project.scripts]
azv-agent = "azv_agent.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["azv_agent"]
